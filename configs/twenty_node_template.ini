[Network]
topology = BasicArbitrary
routing_algorithm = NRL_routing
n_nodes = 20
buffer_size = 32
d2d_IF = on_chip
router_stages = FourStage
processing_time = 6
credit_delay = 1
max_inflight_per_node = 0
adjaceny_matrix_filename = ./<topo>.map
nrl_filename = ./<topo>_<routing>.nrl
vc_filename = ./<topo>_<routing>_<vc_alloc>.vcmat
vc_type = dateline
vc_version = 1
nrl_version = 1
vc_number = 16
num_escape_vcs = 3

[Workload]
traffic = netrace
node_id_remap = 1
run_all_regions = 1

[Files]
netrace_file = ./input/parsec_traces/<benchmark>_64c_<size>.tra.bz2

[Simulation]
injection_increment = 0.05
threads = 32
issue_width = 16
