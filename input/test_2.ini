[Network]
topology = BasicArbitrary
routing_algorithm = NRL_routing
n_nodes = 128
buffer_size = 20
vc_number = 4
num_escape_vcs = 2
# d2d_IF = off_chip_parallel
d2d_IF = off_chip_serial
adjaceny_matrix_filename = ./topologies_and_routing/topo_maps/pdtt_2c_128r_6p_4x4x8.map
nrl_filename = ./topologies_and_routing/nr_lists/pdtt_2c_128r_6p_4x4x8_dor_new_mclb.nrl2
vc_filename = ./topologies_and_routing/vc_mats/pdtt_2c_128r_6p_4x4x8_dor_new_mclb.vcmat2
vc_type = dateline
nrl_version = 2
vc_version = 2

[Workload]
traffic = uniform

[Simulation]
injection_increment = 0.25
threads = 32
;   int timeout_threshold;
;   int timeout_limit;
;   int threads;
;   // Each thread fetches issue_width packets at a time
;   int issue_width;


