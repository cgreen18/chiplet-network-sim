[Network]
topology = BasicArbitrary
routing_algorithm = NRL_routing
n_nodes = 8192
buffer_size = 20
vc_number = 4
num_escape_vcs = 2
# d2d_IF = off_chip_parallel
d2d_IF = off_chip_serial
adjaceny_matrix_filename = topologies_and_routing/topo_maps/pt_128c_8192r_6p_16x16x32.map
