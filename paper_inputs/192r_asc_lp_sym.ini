[Network]
topology = SingleNodeArbitrary
routing_algorithm = NRL_routing
n_nodes = 192
buffer_size = 20
vc_number = 4
router_stages = ThreeStage
packet_length = 6
d2d_IF = tpu_v5p
adjaceny_matrix_filename = topologies_and_routing/topo_maps/asc_lp_sym_3c_192r_6p_4x4x12_4x4x4.map
nrl_filename = ./topologies_and_routing/nr_lists/asc_lp_sym_3c_192r_6p_4x4x12_4x4x4_turns_allowed_cpl_safe_new_mclb.nrl2
vc_filename = topologies_and_routing/vc_mats/asc_lp_sym_3c_192r_6p_4x4x12_4x4x4_turns_allowed_cpl_safe_new_mclb_olb.vcmat2
vc_type = dateline
vc_version = 2
nrl_version = 2

[Workload]
traffic = uniform

[Simulation]
injection_increment = 0.01
threads = 32
simulation_time = 100000
timeout_threshold = 10000
timeout_limit = 1000
issue_width = 100
