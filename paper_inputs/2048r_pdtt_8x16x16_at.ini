router_stages = ThreeStage
packet_length = 6
d2d_IF = tpu_v5p
adjaceny_matrix_filename = topologies_and_routing/topo_maps/pdtt_32c_2048r_6p_8x16x16.map
nrl_filename = ./topologies_and_routing/nr_lists/pdtt_32c_2048r_6p_8x16x16_turns_allowed_cpl_safe_refl-transsym_4x4x4mc_symrouting_canonsrcs_new_mclb_refl-transsym_4x4x4mc.nrl2
