[Network]
topology = SingleNodeArbitrary
routing_algorithm = NRL_routing
n_nodes = \N_NODES\
buffer_size = 20
vc_number = 4
router_stages = ThreeStage
packet_length = 6
d2d_IF = tpu_v5p
adjaceny_matrix_filename = topologies_and_routing/topo_maps/\BASE_NAME\.map
nrl_filename = topologies_and_routing/nr_lists/\BASE_NAME\_\ROUTING_FUNC\_failocs\OCS\.nrl2
vc_filename = topologies_and_routing/vc_mats/\BASE_NAME\_\ROUTING_FUNC\_failocs\OCS\\VC_SUFFIX\.vcmat2
vc_type = dateline
vc_version = 2
nrl_version = 2

[Workload]
traffic = uniform

[Simulation]
injection_increment = \INJECTION_INCREMENT\
threads = \THREADS\
simulation_time = 100000
timeout_threshold = 10000
timeout_limit = 1000
issue_width = 100
