[Network]
topology = BasicArbitrary
routing_algorithm = NRL_routing
n_nodes = 128
buffer_size = 100
vc_number = 4
router_stages = OneStage
packet_length = 1
d2d_IF = tpu_v5p
adjaceny_matrix_filename = topologies_and_routing/topo_maps/pdtt_2c_128r_6p_4x4x8.map
nrl_filename = ./topologies_and_routing/nr_lists/pdtt_2c_128r_6p_4x4x8_dor_new_mclb.nrl2
vc_filename = topologies_and_routing/vc_mats/pdtt_2c_128r_6p_4x4x8_dor_new_mclb.vcmat2
vc_type = dateline
vc_version = 2
nrl_version = 2

[Workload]
traffic = netrace

[Simulation]
injection_increment = 0.5
threads = 32
simulation_time = 1000000000
timeout_threshold = 100000
timeout_limit = 100000
issue_width = 128

[Files]
netrace_file = traces/128_a2a.tra.bz2